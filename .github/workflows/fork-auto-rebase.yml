name: fork-auto-rebase

on:
  schedule:
    # UTC 18:00 = Asia/Shanghai 02:00.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: fork-auto-rebase
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  rebase:
    name: Rebase fork on upstream
    # codex-voice-host needs GStreamer >= 1.28 on linux-gnu; 24.04 only has 1.24.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.CODEX_PAT }}
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openai/codex.git
          echo "pre_rebase_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for new upstream commits
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch upstream main

          old_upstream_sha="$(git merge-base upstream/main HEAD)"
          new_upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits; nothing to push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "old_upstream_sha=${old_upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "new_upstream_sha=${new_upstream_sha}" >> "$GITHUB_OUTPUT"

      - name: Capture pre-rebase fork history
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git log --format='%s' --reverse \
            "${{ steps.check.outputs.old_upstream_sha }}..${{ steps.setup.outputs.pre_rebase_sha }}" \
            > "$RUNNER_TEMP/pre-rebase-fork-commits.txt"

      - name: Download Codex++ fork binary
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release view -R yuguorui/codex-plus --json tagName -q '.tagName')"
          asset="codex-package-x86_64-unknown-linux-musl.tar.gz"

          tmp_dir="$(mktemp -d)"
          gh release download "$tag" -R yuguorui/codex-plus -p "$asset" --dir "$tmp_dir"
          mkdir -p "$tmp_dir/extract"
          tar -xzf "$tmp_dir/$asset" -C "$tmp_dir/extract"

          BIN_DIR="/tmp/codexpp-bin"
          mkdir -p "$BIN_DIR"
          for binary in codex++ codex-code-mode-host; do
            binary_path="$(find "$tmp_dir/extract" -name "$binary" -type f -print -quit)"
            if [[ -z "$binary_path" ]]; then
              echo "Release package is missing $binary." >&2
              exit 1
            fi
            cp "$binary_path" "$BIN_DIR/$binary"
            chmod +x "$BIN_DIR/$binary"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          rm -rf "$tmp_dir"

      - name: Verify Codex++ runtime
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for binary in codex++ codex-code-mode-host; do
            binary_path="$(command -v "$binary")"
            if [[ ! -x "$binary_path" ]]; then
              echo "$binary is not executable: $binary_path" >&2
              exit 1
            fi
          done

          codex++ --version
          codex-code-mode-host --help >/dev/null

      - name: Install Linux dependencies for validation
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libasound2-dev

      - name: Resolve Rust toolchain
        id: rust
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain_toml="$(git show upstream/main:codex-rs/rust-toolchain.toml 2>/dev/null || cat codex-rs/rust-toolchain.toml)"
          channel="$(printf '%s\n' "$toolchain_toml" | sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p')"
          if [[ -z "$channel" ]]; then
            echo "Could not resolve channel from codex-rs/rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "Rust toolchain: ${channel}"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (supports the toolchain input)
        if: steps.check.outputs.has_changes == 'true'
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        if: steps.check.outputs.has_changes == 'true'
        with:
          tool: just, nextest

      - name: Configure rusty_v8 artifact overrides
        if: steps.check.outputs.has_changes == 'true'
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Rebase with Codex++ (DeepSeek Responses)
        if: steps.check.outputs.has_changes == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_ANTHROPIC_API_KEY }}
          PRE_REBASE_SHA: ${{ steps.setup.outputs.pre_rebase_sha }}
          OLD_UPSTREAM_SHA: ${{ steps.check.outputs.old_upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail

          log_rebase_agent_failure() {
            status="$1"
            echo "::error::rebase agent exited with ${status} at $(date -u +%FT%TZ)"
            ps -eo pid,ppid,pgid,etime,rss,stat,cmd | head -100 || true
            free -h || true
            df -h || true
            (dmesg | tail -20) 2>/dev/null || true
          }
          trap 'status=$?; log_rebase_agent_failure "${status}"; exit "${status}"' TERM INT

          set +e
          codex++ exec \
            --model deepseek-v4-flash \
            --ephemeral \
            --dangerously-bypass-approvals-and-sandbox \
            -c 'model_provider="deepseek"' \
            -c 'model_providers.deepseek.name="DeepSeek"' \
            -c 'model_providers.deepseek.base_url="https://api.deepseek.com/"' \
            -c 'model_providers.deepseek.env_key="DEEPSEEK_API_KEY"' \
            -c 'model_providers.deepseek.wire_api="responses"' \
            -c 'model_context_window=1000000' \
            "Rebase this Codex++ fork onto \`upstream/main\`. Do not push.

          1. Rebase
          - Before rebasing, inspect the fork context:
            \`git log --oneline upstream/main..HEAD\` lists commits unique to
            this fork; \`git diff --stat upstream/main...HEAD\` shows the size
            of its net changes; and \`git diff --name-only upstream/main...HEAD\`
            lists affected files. Read the relevant diffs so you understand the
            fork behavior that must be preserved.
          - Then run \`git rebase upstream/main\`.
          - Resolve conflicts without discarding fork behavior or unrelated
            upstream changes. Continue until no rebase is in progress.
          - Never hand-merge generated schema or fixture files during a rebase.
            When \`codex-rs/core/config.schema.json\` conflicts, resolve all
            Rust source conflicts for that commit first, then regenerate it
            directly using the \`dev-small\` profile (\`git checkout --ours
            codex-rs/core/config.schema.json && cargo run --manifest-path
            codex-rs/Cargo.toml --profile dev-small -p codex-config-schema
            --bin codex-write-config-schema && git add
            codex-rs/core/config.schema.json\`) so every commit stays
            individually valid without building a separate \`dev\` artifact
            tree. Apply the same regenerate-instead-of-merge rule to app-server
            protocol schema fixtures (\`just write-app-server-schema\`) whenever
            they conflict.
          - After the rebase and autosquash are complete, use \`git range-diff\`
            with \`OLD_UPSTREAM_SHA\`, \`PRE_REBASE_SHA\`, and the current
            upstream merge base. Every curated fork commit must remain
            represented. Do not silently drop an otherwise-empty fork commit;
            stop and explain instead.

          2. Repair and validate
          - Use the \`dev-small\` Cargo profile for all compilation and testing
            during rebase (\`--profile dev-small\` for \`cargo check\` /
            \`cargo run\`, and \`--cargo-profile dev-small\` for \`just test\` /
            \`cargo nextest run\`) so builds link faster, use less disk space,
            and reuse one \`target/dev-small\` cache.
          - From the repository root, run
            \`.github/scripts/fork-key-tests.sh\`. It runs with the
            \`dev-small\` profile by default, checks formatting and production
            targets, runs the complete \`codex-workflow-extension\` suite, and
            runs curated tests for the other fork-critical behaviors.
          - If the script fails, make manual, targeted edits; do not use
            scripts or global replacements to mass-edit Rust source. Rerun the
            script after each repair until it passes.
          - Do not run the full workspace test suite, \`cargo check
            --workspace --all-targets\`, or a release build; leave those to the
            normal CI and release pipelines.
          - Before every commit (including fixups), run \`cargo fmt\` so no
            unformatted code lands. Apply formatting and never judge success by
            grepping \`cargo fmt --check\` output (that discards its exit code).

          3. Finish cleanly
          - Inspect \`git diff --check\`. Put every repair into its owning fork
            commit with \`git commit --fixup=<commit>\`, then run
            \`GIT_SEQUENCE_EDITOR=: git rebase -i --autosquash upstream/main\`.
          - Finish only when \`git status --porcelain=v1 -uall\` has no output.

          If the rebase or validation cannot be repaired safely, stop and explain
          the blocker in your final message."
          status=$?
          set -e
          if [[ ${status} -ne 0 ]]; then
            log_rebase_agent_failure "${status}"
          fi
          exit "${status}"

      - name: Audit rebased fork invariants
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${{ steps.check.outputs.new_upstream_sha }}" HEAD
          ./.github/scripts/validate-fork-rebase.sh \
            "${{ steps.check.outputs.old_upstream_sha }}" \
            "$(git rev-parse upstream/main)" \
            "${{ steps.setup.outputs.pre_rebase_sha }}"

      - name: Verify rebase completed
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
            echo "Rebase is still in progress."
            git status --short --branch
            exit 1
          fi

          if git status --porcelain=v1 -uall | grep -q .; then
            echo "Working tree is not clean after rebase."
            git status --short
            exit 1
          fi

      - name: Validate rebased fork
        id: validate
        if: steps.check.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/fork-key-tests.sh

      - name: Push rebased fork branch
        id: push
        if: steps.check.outputs.has_changes == 'true' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger fork release
        # A manual dispatch with no upstream changes should still release main,
        # but a failed rebase/validation must never trigger a release.
        if: steps.push.outputs.pushed == 'true' || (github.event_name == 'workflow_dispatch' && steps.check.outputs.has_changes == 'false')
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CODEX_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run fork-release.yml -R yuguorui/codex-plus --ref main
