name: fork-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in yyyymmddhhmm format. Defaults to current Asia/Shanghai time."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: false
        type: boolean
        default: false

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      rust_channel: ${{ steps.rust.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          requested_version="${{ inputs.version }}"
          if [[ -z "$requested_version" ]]; then
            requested_version="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          fi

          if [[ ! "$requested_version" =~ ^[0-9]{12}$ ]]; then
            echo "Version ${requested_version} does not match yyyymmddhhmm."
            exit 1
          fi

          echo "version=${requested_version}" >> "$GITHUB_OUTPUT"
          echo "tag=rust-v${requested_version}" >> "$GITHUB_OUTPUT"

      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' codex-rs/rust-toolchain.toml)"
          if [[ -z "$channel" ]]; then
            echo "Could not resolve channel from codex-rs/rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "Rust toolchain: ${channel}"

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: codex-rs
    env:
      # macOS release builds archive packed dSYM bundles before stripping.
      # Without this, [profile.release] split-debuginfo = "off" emits no
      # .dSYM and the symbols archiving step fails.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
      # Thin-LTO links dominate wall time (about two thirds of the macOS
      # build on a 3-vCPU runner). Trade a little runtime performance and
      # binary size for a build that fits inside the job timeout.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_BUILD_JOBS: ${{ matrix.cargo-build-jobs }}
      CODEX_FORK_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      # Fetch git dependencies and their nested native-library submodules via
      # the git CLI; libgit2/SecureTransport can drop long rusty_v8 fetches.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binaries: "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy bwrap"
            cargo-build-jobs: "2"
          - runner: macos-15
            target: aarch64-apple-darwin
            binaries: "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy"
            cargo-build-jobs: "4"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binaries: "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy codex-command-runner codex-windows-sandbox-setup"
            cargo-build-jobs: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable Git long paths (Windows)
        if: ${{ contains(matrix.target, 'pc-windows-msvc') }}
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            libubsan1 \
            pkg-config \
            zstd

      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (supports the toolchain input)
        with:
          toolchain: ${{ needs.metadata.outputs.rust_channel }}
          targets: ${{ matrix.target }}

      - name: Install DotSlash for package compression
        if: ${{ contains(matrix.target, 'pc-windows-msvc') }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Configure MSVC linker
        if: ${{ contains(matrix.target, 'pc-windows-msvc') }}
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Use hermetic Cargo home for musl
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig for musl
        if: ${{ contains(matrix.target, 'musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: ${{ contains(matrix.target, 'musl') }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rustc UBSan wrapper for musl
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clear sanitizer flags for musl
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          cflags="${CFLAGS-}"
          cxxflags="${CXXFLAGS-}"
          {
            echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1"
            echo "AWS_LC_SYS_NO_JITTER_ENTROPY_X86_64_UNKNOWN_LINUX_MUSL=1"
            echo "RUSTFLAGS="
            echo "CARGO_ENCODED_RUSTFLAGS="
            echo "RUSTDOCFLAGS="
            echo "CARGO_BUILD_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="
            echo "CFLAGS=${cflags//-fsanitize=undefined/}"
            echo "CXXFLAGS=${cxxflags//-fsanitize=undefined/}"
          } >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target ${{ matrix.target }} --release --timings "${build_args[@]}"

      - name: Build symbols archive and strip binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          binaries=()
          for binary in ${{ matrix.binaries }}; do
            if [[ "$binary" == "bwrap" ]]; then
              continue
            fi
            binaries+=("$binary")
          done
          if [[ "$target" == *pc-windows-msvc ]]; then
            for binary in "${binaries[@]}"; do
              pdb_name="${binary//-/_}"
              if [[ ! -f "target/${target}/release/${binary}.pdb" && -f "target/${target}/release/${pdb_name}.pdb" ]]; then
                cp "target/${target}/release/${pdb_name}.pdb" "target/${target}/release/${binary}.pdb"
              fi
            done
          fi
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$target" \
            --artifact-name "$target" \
            --release-dir "target/${target}/release" \
            --archive-dir "symbols-dist/${target}" \
            --binaries "${binaries[*]}"

      - name: Upload symbols archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-symbols
          path: codex-rs/symbols-dist/${{ matrix.target }}/*
          if-no-files-found: error

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          dest="dist/${target}"
          mkdir -p "$dest"

          exe_suffix=""
          if [[ "$target" == *pc-windows-msvc ]]; then
            exe_suffix=".exe"
          fi

          for binary in ${{ matrix.binaries }}; do
            cp "target/${target}/release/${binary}${exe_suffix}" "$dest/${binary}-${target}${exe_suffix}"
          done

          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$target" \
            --bundle primary \
            --entrypoint-dir "target/${target}/release" \
            --entrypoint-stem "codex++" \
            --archive-dir "$dest"

          rm -f "$dest"/*.tar.zst "$dest"/*.zst
          find "$dest" -type f ! -name 'codex-package-*.tar.gz' -delete

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: codex-rs/dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Add checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f \
            -name 'codex-package-*.tar.gz' \
            -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" | awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > dist/codex-package_SHA256SUMS

          cat dist/codex-package_SHA256SUMS

      - name: Add fork install script
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          sed "s#__RELEASE_REPOSITORY__#${RELEASE_REPOSITORY}#g" \
            scripts/install/install-fork.sh > dist/install-fork.sh
          chmod +x dist/install-fork.sh

      - name: Add Windows fork install script
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > dist/install-fork.ps1 <<'INSTALL_PS1'
          <#
          .SYNOPSIS
          Install the Codex++ standalone release on Windows.

          .DESCRIPTION
          Downloads the x86_64-pc-windows-msvc package archive for the requested
          release, verifies its SHA-256 checksum, extracts it under
          %CODEX_HOME%\packages\standalone, and installs the codex++ executable
          into the binary directory.

          .PARAMETER Version
          Release to install: "latest" (default), "rust-vyyyymmddhhmm",
          "vyyyymmddhhmm", or "yyyymmddhhmm".

          Environment variables:
            CODEX_RELEASE_REPOSITORY  owner/repo to download from (default __RELEASE_REPOSITORY__)
            CODEX_INSTALL_DIR         directory that receives the executable (default %USERPROFILE%\.local\bin)
            CODEX_BIN_NAME            installed command name (default codex++)
            CODEX_HOME                Codex home directory (default %USERPROFILE%\.codex)
          #>
          [CmdletBinding()]
          param(
              [string] $Version = "latest"
          )

          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $repo = "__RELEASE_REPOSITORY__"
          if ($env:CODEX_RELEASE_REPOSITORY) { $repo = $env:CODEX_RELEASE_REPOSITORY }
          $binName = "codex++"
          if ($env:CODEX_BIN_NAME) { $binName = $env:CODEX_BIN_NAME }
          $codexHome = Join-Path $HOME ".codex"
          if ($env:CODEX_HOME) { $codexHome = $env:CODEX_HOME }
          $binDir = Join-Path $HOME ".local\bin"
          if ($env:CODEX_INSTALL_DIR) { $binDir = $env:CODEX_INSTALL_DIR }

          $packageBinName = "codex++"
          $target = "x86_64-pc-windows-msvc"
          $standaloneRoot = Join-Path $codexHome "packages\standalone"
          $releasesDir = Join-Path $standaloneRoot "releases"
          $currentLink = Join-Path $standaloneRoot "current"

          # The x86_64 package also runs on ARM64 Windows through x64 emulation.
          if (-not [System.Environment]::Is64BitOperatingSystem) {
              throw "This fork release requires 64-bit Windows."
          }

          function Normalize-Version {
              param([string] $Value)
              if ([string]::IsNullOrEmpty($Value) -or $Value -eq "latest") { return "latest" }
              if ($Value.StartsWith("rust-v")) { return $Value.Substring("rust-v".Length) }
              if ($Value.StartsWith("v")) { return $Value.Substring(1) }
              return $Value
          }

          function Resolve-Version {
              param([string] $Value)
              $normalized = Normalize-Version -Value $Value
              if ($normalized -ne "latest") { return $normalized }

              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers @{ "User-Agent" = "codex-fork-installer" }
              if ($release.tag_name -match "^rust-v([0-9]+)$") {
                  return $Matches[1]
              }
              throw "Failed to resolve latest release for $repo."
          }

          function Get-InstalledVersion {
              param([string] $BinaryPath)
              if (-not (Test-Path $BinaryPath)) { return $null }
              $output = & $BinaryPath --version 2>$null | Select-Object -Last 1
              if ($LASTEXITCODE -ne 0) { return $null }
              if ($output -match " ([0-9][0-9A-Za-z.+-]*)$") {
                  return $Matches[1]
              }
              return $null
          }

          function Test-ReleaseIsComplete {
              param([string] $ReleaseDir)
              $required = @(
                  (Join-Path $ReleaseDir "codex-package.json"),
                  (Join-Path $ReleaseDir "bin\$packageBinName.exe"),
                  (Join-Path $ReleaseDir "bin\codex-code-mode-host.exe"),
                  (Join-Path $ReleaseDir "codex-path\rg.exe")
              )
              foreach ($path in $required) {
                  if (-not (Test-Path $path)) { return $false }
              }
              return $true
          }

          function Activate-Release {
              param([string] $ReleaseDir)
              New-Item -ItemType Directory -Force -Path $binDir | Out-Null
              New-Item -ItemType Directory -Force -Path $releasesDir | Out-Null

              # Recreate the "current" junction without touching its target.
              if (Test-Path $currentLink -PathType Any) {
                  & cmd.exe /c rmdir "`"$currentLink`""
                  if ($LASTEXITCODE -ne 0) { throw "Failed to replace the current link at $currentLink" }
              }
              New-Item -ItemType Junction -Path $currentLink -Target $ReleaseDir | Out-Null

              Copy-Item -Path (Join-Path $ReleaseDir "bin\$packageBinName.exe") -Destination (Join-Path $binDir "$binName.exe") -Force
              Copy-Item -Path (Join-Path $ReleaseDir "bin\codex-code-mode-host.exe") -Destination (Join-Path $binDir "codex-code-mode-host.exe") -Force
          }

          $version = Resolve-Version -Value $Version
          $tag = "rust-v$version"
          $asset = "codex-package-$target.tar.gz"
          $baseUrl = "https://github.com/$repo/releases/download/$tag"
          $releaseDir = Join-Path $releasesDir "$version-$target"

          $installedVersion = Get-InstalledVersion -BinaryPath (Join-Path $releaseDir "bin\$packageBinName.exe")
          if ($installedVersion -eq $version -and (Test-ReleaseIsComplete -ReleaseDir $releaseDir)) {
              Activate-Release -ReleaseDir $releaseDir
              Write-Host "$binName $version is already up to date."
              exit 0
          }

          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ("codex-fork-install-" + [System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          try {
              $sumsPath = Join-Path $tempDir "codex-package_SHA256SUMS"
              $archivePath = Join-Path $tempDir $asset
              Invoke-WebRequest -Uri "$baseUrl/codex-package_SHA256SUMS" -OutFile $sumsPath
              Invoke-WebRequest -Uri "$baseUrl/$asset" -OutFile $archivePath

              $expected = $null
              foreach ($line in Get-Content $sumsPath) {
                  $fields = $line -split "\s+"
                  if ($fields.Count -ge 2 -and $fields[1] -eq $asset -and $fields[0] -match "^[0-9a-fA-F]{64}$") {
                      $expected = $fields[0]
                      break
                  }
              }
              if (-not $expected) {
                  throw "Checksum for $asset not found in codex-package_SHA256SUMS."
              }

              $actual = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected.ToLowerInvariant()) {
                  throw "Checksum mismatch for $asset. Expected $expected, got $actual."
              }

              if (Test-Path $releaseDir) {
                  Remove-Item -Path $releaseDir -Recurse -Force
              }
              New-Item -ItemType Directory -Path $releaseDir | Out-Null
              & tar.exe -C $releaseDir -xzf $archivePath
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract $asset."
              }

              Activate-Release -ReleaseDir $releaseDir
              Write-Host "Installed $binName $version for $target at $releaseDir"
              Write-Host "Ensure $binDir is on your PATH."
              Write-Host "Restart any running Codex++ processes to use this version."
          }
          finally {
              Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          INSTALL_PS1
          sed -i "s#__RELEASE_REPOSITORY__#${RELEASE_REPOSITORY}#g" dist/install-fork.ps1

      - name: Validate Windows fork installer syntax
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ tokens are PowerShell syntax, not shell expansions.
          pwsh -NoProfile -Command '
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              "$env:GITHUB_WORKSPACE/dist/install-fork.ps1",
              [ref]$tokens,
              [ref]$parseErrors
            )
            foreach ($parseError in $parseErrors) {
              Write-Error $parseError.Message
            }
            exit $parseErrors.Count
          '

      - name: Test fork installer
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/install/test-install-fork.sh

      - name: Generate changelog with Codex++
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          input_file="${RUNNER_TEMP}/changelog-input.md"
          upstream_commits="${RUNNER_TEMP}/upstream-commits.txt"
          repo_url="https://github.com/${GITHUB_REPOSITORY}"

          # Resolve the previous release before fetching upstream so upstream's
          # rust-v* tags can never leak into this lookup. Fork release versions
          # are fixed-width timestamps, so lexical sort is authoritative.
          previous_tag="$(
            git tag --list 'rust-v*' |
              grep -Ex 'rust-v[0-9]{12}' |
              grep -vx "$RELEASE_TAG" |
              sort |
              tail -n 1 || true
          )"

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/openai/codex.git
          fi

          if ! git fetch --no-tags upstream main; then
            echo "::error::Failed to fetch upstream main; cannot generate the upstream-only changelog."
            exit 1
          fi

          # The nightly rebase rewrites fork history, so use the previous fork
          # release only as the changelog boundary. Upstream commits are then
          # bounded by HEAD's merge base with upstream/main.
          : > "$upstream_commits"
          if [[ -n "$previous_tag" ]]; then
            fork_upstream_base="$(git merge-base HEAD upstream/main)"
            git log --format='%h %s' "${previous_tag}..${fork_upstream_base}" > "$upstream_commits"
          fi

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Release version: ${RELEASE_VERSION}"
            echo "Previous release tag: ${previous_tag:-none}"
            echo
            echo "## Upstream commits since previous release"
            if [[ -s "$upstream_commits" ]]; then
              cat "$upstream_commits"
            else
              echo "(none)"
            fi
          } > "$input_file"

          write_fallback_notes() {
            {
              echo "## Upstream sync"
              if [[ -s "$upstream_commits" ]]; then
                sed 's/^/- /' "$upstream_commits"
              else
                echo "- No upstream changes in this release."
              fi
              echo
              echo "**Full Changelog**: ${repo_url}/commits/${RELEASE_TAG}"
            } > "$notes_file"
          }

          package="dist/x86_64-unknown-linux-musl/codex-package-x86_64-unknown-linux-musl.tar.gz"
          bin_root="${RUNNER_TEMP}/codexpp"
          mkdir -p "$bin_root"
          tar -xzf "$package" -C "$bin_root"
          export PATH="${bin_root}/bin:${PATH}"
          codex++ --version

          prompt="$(cat <<EOF
          Read ${input_file}, write a user-facing English changelog for Codex++ ${RELEASE_VERSION}, and write the result only to ${notes_file}.

          Requirements:
          1. The only section heading is "## Upstream sync": summarize commits from Upstream commits since previous release, aggregating changes synced from upstream openai/codex by topic instead of listing every commit. If there are none, write exactly "No upstream changes in this release." under the heading.
          2. Ignore rebase, formatting, and CI-maintenance noise; never invent information that is not in the input.
          3. Keep the whole document under 60 lines and use no code blocks.
          4. The last line must be exactly: **Full Changelog**: ${repo_url}/commits/${RELEASE_TAG}
          5. Do not create, modify, or delete any file other than ${notes_file}.
          EOF
          )"

          # Run outside the repository so the model cannot dirty release inputs.
          cd "$RUNNER_TEMP"
          set +e
          timeout 420 codex++ exec \
            --model deepseek-v4-flash \
            --ephemeral \
            --dangerously-bypass-approvals-and-sandbox \
            -c 'model_provider="deepseek"' \
            -c 'model_providers.deepseek.name="DeepSeek"' \
            -c 'model_providers.deepseek.base_url="https://api.deepseek.com/"' \
            -c 'model_providers.deepseek.env_key="DEEPSEEK_API_KEY"' \
            -c 'model_providers.deepseek.wire_api="responses"' \
            -c 'model_context_window=1000000' \
            "$prompt"
          codex_status=$?
          set -e

          heading_count="$(grep -c '^#' "$notes_file" || true)"
          first_line="$(head -n 1 "$notes_file" 2>/dev/null || true)"
          last_line="$(tail -n 1 "$notes_file" 2>/dev/null || true)"
          expected_last_line="**Full Changelog**: ${repo_url}/commits/${RELEASE_TAG}"
          if [[ $codex_status -ne 0 ||
                ! -s "$notes_file" ||
                "$heading_count" != 1 ||
                "$first_line" != "## Upstream sync" ||
                "$last_line" != "$expected_last_line" ]]; then
            echo "::warning::Codex++ changelog generation failed (exit ${codex_status}); using raw commits."
            write_fallback_notes
          fi

          cat "$notes_file"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ needs.metadata.outputs.version }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/**
          overwrite_files: true
          make_latest: ${{ ! inputs.prerelease }}
          prerelease: ${{ inputs.prerelease }}
