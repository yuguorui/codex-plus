name: fork-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in yyyymmddhhmm format. Defaults to current Asia/Shanghai time."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: false
        type: boolean
        default: false

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          requested_version="${{ inputs.version }}"
          if [[ -z "$requested_version" ]]; then
            requested_version="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          fi

          if [[ ! "$requested_version" =~ ^[0-9]{12}$ ]]; then
            echo "Version ${requested_version} does not match yyyymmddhhmm."
            exit 1
          fi

          echo "version=${requested_version}" >> "$GITHUB_OUTPUT"
          echo "tag=rust-v${requested_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    env:
      # macOS release builds archive packed dSYM bundles before stripping.
      # Without this, [profile.release] split-debuginfo = "off" emits no
      # .dSYM and the symbols archiving step fails.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.release-codegen-units }}
      CARGO_BUILD_JOBS: ${{ matrix.cargo-build-jobs }}
      CODEX_FORK_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binaries: "codex codex-responses-api-proxy bwrap"
            cargo-build-jobs: "2"
            release-codegen-units: "8"
          - runner: macos-15
            target: aarch64-apple-darwin
            binaries: "codex codex-responses-api-proxy"
            cargo-build-jobs: "4"
            release-codegen-units: "8"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binaries: "codex codex-code-mode-host codex-responses-api-proxy codex-command-runner codex-windows-sandbox-setup"
            cargo-build-jobs: "4"
            release-codegen-units: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            libubsan1 \
            pkg-config \
            zstd

      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install DotSlash for package compression
        if: ${{ contains(matrix.target, 'pc-windows-msvc') }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Configure MSVC linker
        if: ${{ contains(matrix.target, 'pc-windows-msvc') }}
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Use hermetic Cargo home for musl
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig for musl
        if: ${{ contains(matrix.target, 'musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: ${{ contains(matrix.target, 'musl') }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rustc UBSan wrapper for musl
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clear sanitizer flags for musl
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          cflags="${CFLAGS-}"
          cxxflags="${CXXFLAGS-}"
          {
            echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1"
            echo "AWS_LC_SYS_NO_JITTER_ENTROPY_X86_64_UNKNOWN_LINUX_MUSL=1"
            echo "RUSTFLAGS="
            echo "CARGO_ENCODED_RUSTFLAGS="
            echo "RUSTDOCFLAGS="
            echo "CARGO_BUILD_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="
            echo "CFLAGS=${cflags//-fsanitize=undefined/}"
            echo "CXXFLAGS=${cxxflags//-fsanitize=undefined/}"
          } >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target ${{ matrix.target }} --release --timings "${build_args[@]}"

      - name: Build symbols archive and strip binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          binaries=()
          for binary in ${{ matrix.binaries }}; do
            if [[ "$binary" == "bwrap" ]]; then
              continue
            fi
            binaries+=("$binary")
          done
          if [[ "$target" == *pc-windows-msvc ]]; then
            for binary in "${binaries[@]}"; do
              pdb_name="${binary//-/_}"
              if [[ ! -f "target/${target}/release/${binary}.pdb" && -f "target/${target}/release/${pdb_name}.pdb" ]]; then
                cp "target/${target}/release/${pdb_name}.pdb" "target/${target}/release/${binary}.pdb"
              fi
            done
          fi
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$target" \
            --artifact-name "$target" \
            --release-dir "target/${target}/release" \
            --archive-dir "symbols-dist/${target}" \
            --binaries "${binaries[*]}"

      - name: Upload symbols archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-symbols
          path: codex-rs/symbols-dist/${{ matrix.target }}/*
          if-no-files-found: error

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          dest="dist/${target}"
          mkdir -p "$dest"

          exe_suffix=""
          if [[ "$target" == *pc-windows-msvc ]]; then
            exe_suffix=".exe"
          fi

          for binary in ${{ matrix.binaries }}; do
            cp "target/${target}/release/${binary}${exe_suffix}" "$dest/${binary}-${target}${exe_suffix}"
          done

          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$target" \
            --bundle primary \
            --entrypoint-dir "target/${target}/release" \
            --entrypoint-stem "codex++" \
            --archive-dir "$dest"

          rm -f "$dest"/*.tar.zst "$dest"/*.zst
          find "$dest" -type f ! -name 'codex-package-*.tar.gz' -delete

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: codex-rs/dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Add checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f \
            -name 'codex-package-*.tar.gz' \
            -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" | awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > dist/codex-package_SHA256SUMS

          cat dist/codex-package_SHA256SUMS

      - name: Add fork install script
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > dist/install-fork.sh <<'INSTALL_SCRIPT'
          #!/usr/bin/env sh
          set -eu

          REPO="${CODEX_RELEASE_REPOSITORY:-__RELEASE_REPOSITORY__}"
          RELEASE="${1:-latest}"
          BIN_DIR="${CODEX_INSTALL_DIR:-$HOME/.local/bin}"
          BIN_NAME="${CODEX_BIN_NAME:-codex++}"
          PACKAGE_BIN_NAME="codex++"
          CODEX_HOME_DIR="${CODEX_HOME:-$HOME/.codex}"
          STANDALONE_ROOT="$CODEX_HOME_DIR/packages/standalone"
          RELEASES_DIR="$STANDALONE_ROOT/releases"
          CURRENT_LINK="$STANDALONE_ROOT/current"

          usage() {
            cat <<'EOF'
          Usage: install-fork.sh [VERSION]

          VERSION may be "latest", "rust-vyyyymmddhhmm", or "yyyymmddhhmm".
          Set CODEX_RELEASE_REPOSITORY=owner/repo to override the release repository.
          Set CODEX_BIN_NAME=name to choose the command name installed into CODEX_INSTALL_DIR.
          EOF
          }

          if [ "${1:-}" = "--help" ] || [ "${1:-}" = "-h" ]; then
            usage
            exit 0
          fi

          download_file() {
            url="$1"
            output="$2"
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL "$url" -o "$output"
            elif command -v wget >/dev/null 2>&1; then
              wget -q -O "$output" "$url"
            else
              echo "curl or wget is required." >&2
              exit 1
            fi
          }

          download_text() {
            url="$1"
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL "$url"
            elif command -v wget >/dev/null 2>&1; then
              wget -q -O - "$url"
            else
              echo "curl or wget is required." >&2
              exit 1
            fi
          }

          normalize_version() {
            case "$1" in
              "" | latest) printf 'latest\n' ;;
              rust-v*) printf '%s\n' "${1#rust-v}" ;;
              v*) printf '%s\n' "${1#v}" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }

          resolve_version() {
            normalized="$(normalize_version "$RELEASE")"
            if [ "$normalized" != "latest" ]; then
              printf '%s\n' "$normalized"
              return
            fi
            release_json="$(download_text "https://api.github.com/repos/$REPO/releases/latest")"
            resolved="$(printf '%s\n' "$release_json" | sed -n 's/.*"tag_name":[[:space:]]*"rust-v\([^"]*\)".*/\1/p' | head -n 1)"
            if [ -z "$resolved" ]; then
              echo "Failed to resolve latest release for $REPO." >&2
              exit 1
            fi
            printf '%s\n' "$resolved"
          }

          installed_version() {
            installed_bin="$1"
            if [ ! -x "$installed_bin" ]; then
              return
            fi
            "$installed_bin" --version 2>/dev/null |
              sed -n 's/.* \([0-9][0-9A-Za-z.+-]*\)$/\1/p' |
              head -n 1
          }

          release_install_is_complete() {
            release_dir="$1"
            [ -d "$release_dir" ] &&
              [ -f "$release_dir/codex-package.json" ] &&
              [ -x "$release_dir/bin/$PACKAGE_BIN_NAME" ] &&
              [ -x "$release_dir/bin/codex-code-mode-host" ] &&
              [ -x "$release_dir/codex-path/rg" ] ||
              return 1

            if [ "$target" = "x86_64-unknown-linux-musl" ]; then
              [ -x "$release_dir/codex-resources/bwrap" ] || return 1
            fi
          }

          activate_release() {
            release_dir="$1"
            mkdir -p "$BIN_DIR" "$RELEASES_DIR"
            ln -sfn "$release_dir" "$CURRENT_LINK"
            ln -sfn "$release_dir/bin/$PACKAGE_BIN_NAME" "$BIN_DIR/$BIN_NAME"
            ln -sfn "$release_dir/bin/codex-code-mode-host" "$BIN_DIR/codex-code-mode-host"
          }

          file_sha256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          case "$(uname -s)" in
            Linux) target="x86_64-unknown-linux-musl" ;;
            Darwin)
              if [ "$(uname -m)" = "arm64" ] || [ "$(uname -m)" = "aarch64" ]; then
                target="aarch64-apple-darwin"
              else
                echo "This fork release only supports Apple Silicon macOS." >&2
                exit 1
              fi
              ;;
            *)
              echo "This fork release only supports Linux x64 and Apple Silicon macOS." >&2
              exit 1
              ;;
          esac

          if [ "$target" = "x86_64-unknown-linux-musl" ] && [ "$(uname -m)" != "x86_64" ] && [ "$(uname -m)" != "amd64" ]; then
            echo "This fork release only supports Linux x64." >&2
            exit 1
          fi

          version="$(resolve_version)"
          tag="rust-v$version"
          asset="codex-package-$target.tar.gz"
          base_url="https://github.com/$REPO/releases/download/$tag"
          release_dir="$RELEASES_DIR/$version-$target"

          current_version="$(installed_version "$release_dir/bin/$PACKAGE_BIN_NAME")"
          if [ "$current_version" = "$version" ] && release_install_is_complete "$release_dir"; then
            activate_release "$release_dir"
            echo "$BIN_NAME $version is already up to date."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT INT TERM

          mkdir -p "$BIN_DIR" "$RELEASES_DIR"
          download_file "$base_url/codex-package_SHA256SUMS" "$tmp_dir/codex-package_SHA256SUMS"
          expected="$(awk -v asset="$asset" '$2 == asset { print $1; found = 1 } END { if (!found) exit 1 }' "$tmp_dir/codex-package_SHA256SUMS")"
          download_file "$base_url/$asset" "$tmp_dir/$asset"
          actual="$(file_sha256 "$tmp_dir/$asset")"
          if [ "$actual" != "$expected" ]; then
            echo "Checksum mismatch for $asset." >&2
            echo "expected: $expected" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -C "$release_dir" -xzf "$tmp_dir/$asset"

          activate_release "$release_dir"
          echo "Installed $BIN_NAME $version for $target at $release_dir"
          echo "Ensure $BIN_DIR is on your PATH."
          echo "Restart any running Codex++ processes to use this version."
          INSTALL_SCRIPT
          sed -i "s#__RELEASE_REPOSITORY__#${RELEASE_REPOSITORY}#g" dist/install-fork.sh
          chmod +x dist/install-fork.sh

      - name: Add Windows fork install script
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > dist/install-fork.ps1 <<'INSTALL_PS1'
          <#
          .SYNOPSIS
          Install the Codex++ standalone release on Windows.

          .DESCRIPTION
          Downloads the x86_64-pc-windows-msvc package archive for the requested
          release, verifies its SHA-256 checksum, extracts it under
          %CODEX_HOME%\packages\standalone, and installs the codex++ executable
          into the binary directory.

          .PARAMETER Version
          Release to install: "latest" (default), "rust-vyyyymmddhhmm",
          "vyyyymmddhhmm", or "yyyymmddhhmm".

          Environment variables:
            CODEX_RELEASE_REPOSITORY  owner/repo to download from (default __RELEASE_REPOSITORY__)
            CODEX_INSTALL_DIR         directory that receives the executable (default %USERPROFILE%\.local\bin)
            CODEX_BIN_NAME            installed command name (default codex++)
            CODEX_HOME                Codex home directory (default %USERPROFILE%\.codex)
          #>
          [CmdletBinding()]
          param(
              [string] $Version = "latest"
          )

          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $repo = "__RELEASE_REPOSITORY__"
          if ($env:CODEX_RELEASE_REPOSITORY) { $repo = $env:CODEX_RELEASE_REPOSITORY }
          $binName = "codex++"
          if ($env:CODEX_BIN_NAME) { $binName = $env:CODEX_BIN_NAME }
          $codexHome = Join-Path $HOME ".codex"
          if ($env:CODEX_HOME) { $codexHome = $env:CODEX_HOME }
          $binDir = Join-Path $HOME ".local\bin"
          if ($env:CODEX_INSTALL_DIR) { $binDir = $env:CODEX_INSTALL_DIR }

          $packageBinName = "codex++"
          $target = "x86_64-pc-windows-msvc"
          $standaloneRoot = Join-Path $codexHome "packages\standalone"
          $releasesDir = Join-Path $standaloneRoot "releases"
          $currentLink = Join-Path $standaloneRoot "current"

          # The x86_64 package also runs on ARM64 Windows through x64 emulation.
          if (-not [System.Environment]::Is64BitOperatingSystem) {
              throw "This fork release requires 64-bit Windows."
          }

          function Normalize-Version {
              param([string] $Value)
              if ([string]::IsNullOrEmpty($Value) -or $Value -eq "latest") { return "latest" }
              if ($Value.StartsWith("rust-v")) { return $Value.Substring("rust-v".Length) }
              if ($Value.StartsWith("v")) { return $Value.Substring(1) }
              return $Value
          }

          function Resolve-Version {
              param([string] $Value)
              $normalized = Normalize-Version -Value $Value
              if ($normalized -ne "latest") { return $normalized }

              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers @{ "User-Agent" = "codex-fork-installer" }
              if ($release.tag_name -match "^rust-v([0-9]+)$") {
                  return $Matches[1]
              }
              throw "Failed to resolve latest release for $repo."
          }

          function Get-InstalledVersion {
              param([string] $BinaryPath)
              if (-not (Test-Path $BinaryPath)) { return $null }
              $output = & $BinaryPath --version 2>$null | Select-Object -Last 1
              if ($LASTEXITCODE -ne 0) { return $null }
              if ($output -match " ([0-9][0-9A-Za-z.+-]*)$") {
                  return $Matches[1]
              }
              return $null
          }

          function Test-ReleaseIsComplete {
              param([string] $ReleaseDir)
              $required = @(
                  (Join-Path $ReleaseDir "codex-package.json"),
                  (Join-Path $ReleaseDir "bin\$packageBinName.exe"),
                  (Join-Path $ReleaseDir "bin\codex-code-mode-host.exe"),
                  (Join-Path $ReleaseDir "codex-path\rg.exe")
              )
              foreach ($path in $required) {
                  if (-not (Test-Path $path)) { return $false }
              }
              return $true
          }

          function Activate-Release {
              param([string] $ReleaseDir)
              New-Item -ItemType Directory -Force -Path $binDir | Out-Null
              New-Item -ItemType Directory -Force -Path $releasesDir | Out-Null

              # Recreate the "current" junction without touching its target.
              if (Test-Path $currentLink -PathType Any) {
                  & cmd.exe /c rmdir "`"$currentLink`""
                  if ($LASTEXITCODE -ne 0) { throw "Failed to replace the current link at $currentLink" }
              }
              New-Item -ItemType Junction -Path $currentLink -Target $ReleaseDir | Out-Null

              Copy-Item -Path (Join-Path $ReleaseDir "bin\$packageBinName.exe") -Destination (Join-Path $binDir "$binName.exe") -Force
              Copy-Item -Path (Join-Path $ReleaseDir "bin\codex-code-mode-host.exe") -Destination (Join-Path $binDir "codex-code-mode-host.exe") -Force
          }

          $version = Resolve-Version -Value $Version
          $tag = "rust-v$version"
          $asset = "codex-package-$target.tar.gz"
          $baseUrl = "https://github.com/$repo/releases/download/$tag"
          $releaseDir = Join-Path $releasesDir "$version-$target"

          $installedVersion = Get-InstalledVersion -BinaryPath (Join-Path $releaseDir "bin\$packageBinName.exe")
          if ($installedVersion -eq $version -and (Test-ReleaseIsComplete -ReleaseDir $releaseDir)) {
              Activate-Release -ReleaseDir $releaseDir
              Write-Host "$binName $version is already up to date."
              exit 0
          }

          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ("codex-fork-install-" + [System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          try {
              $sumsPath = Join-Path $tempDir "codex-package_SHA256SUMS"
              $archivePath = Join-Path $tempDir $asset
              Invoke-WebRequest -Uri "$baseUrl/codex-package_SHA256SUMS" -OutFile $sumsPath
              Invoke-WebRequest -Uri "$baseUrl/$asset" -OutFile $archivePath

              $expected = $null
              foreach ($line in Get-Content $sumsPath) {
                  $fields = $line -split "\s+"
                  if ($fields.Count -ge 2 -and $fields[1] -eq $asset -and $fields[0] -match "^[0-9a-fA-F]{64}$") {
                      $expected = $fields[0]
                      break
                  }
              }
              if (-not $expected) {
                  throw "Checksum for $asset not found in codex-package_SHA256SUMS."
              }

              $actual = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected.ToLowerInvariant()) {
                  throw "Checksum mismatch for $asset. Expected $expected, got $actual."
              }

              if (Test-Path $releaseDir) {
                  Remove-Item -Path $releaseDir -Recurse -Force
              }
              New-Item -ItemType Directory -Path $releaseDir | Out-Null
              & tar.exe -C $releaseDir -xzf $archivePath
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract $asset."
              }

              Activate-Release -ReleaseDir $releaseDir
              Write-Host "Installed $binName $version for $target at $releaseDir"
              Write-Host "Ensure $binDir is on your PATH."
              Write-Host "Restart any running Codex++ processes to use this version."
          }
          finally {
              Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          INSTALL_PS1
          sed -i "s#__RELEASE_REPOSITORY__#${RELEASE_REPOSITORY}#g" dist/install-fork.ps1

      - name: Validate Windows fork installer syntax
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ tokens are PowerShell syntax, not shell expansions.
          pwsh -NoProfile -Command '
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              "$env:GITHUB_WORKSPACE/dist/install-fork.ps1",
              [ref]$tokens,
              [ref]$parseErrors
            )
            foreach ($parseError in $parseErrors) {
              Write-Error $parseError.Message
            }
            exit $parseErrors.Count
          '

      - name: Test fork installer up-to-date path
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/fork-installer-test"
          codex_home="${test_root}/codex-home"
          bin_dir="${test_root}/bin"
          release_dir="${codex_home}/packages/standalone/releases/${RELEASE_VERSION}-x86_64-unknown-linux-musl"

          mkdir -p \
            "${release_dir}/bin" \
            "${release_dir}/codex-resources" \
            "${release_dir}/codex-path" \
            "$bin_dir"
          cat > "${release_dir}/bin/codex++" <<EOF
          #!/bin/sh
          echo "codex-cli ${RELEASE_VERSION}"
          EOF
          chmod +x "${release_dir}/bin/codex++"
          touch "${release_dir}/codex-package.json"
          touch "${release_dir}/bin/codex-code-mode-host"
          touch "${release_dir}/codex-resources/bwrap"
          touch "${release_dir}/codex-path/rg"
          chmod +x \
            "${release_dir}/bin/codex-code-mode-host" \
            "${release_dir}/codex-resources/bwrap" \
            "${release_dir}/codex-path/rg"
          output="$(CODEX_HOME="$codex_home" CODEX_INSTALL_DIR="$bin_dir" sh dist/install-fork.sh "$RELEASE_VERSION")"
          grep -Fx "codex++ ${RELEASE_VERSION} is already up to date." <<<"$output"
          test -x "${codex_home}/packages/standalone/current/bin/codex++"
          test -x "${bin_dir}/codex++"

      - name: Generate changelog with Codex++
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          input_file="${RUNNER_TEMP}/changelog-input.md"
          fork_commits="${RUNNER_TEMP}/fork-commits.txt"
          upstream_commits="${RUNNER_TEMP}/upstream-commits.txt"
          repo_url="https://github.com/${GITHUB_REPOSITORY}"

          # Resolve the previous release before fetching upstream so upstream's
          # rust-v* tags can never leak into this lookup. Fork release versions
          # are fixed-width timestamps, so lexical sort is authoritative.
          previous_tag="$(
            git tag --list 'rust-v*' |
              grep -Ex 'rust-v[0-9]{12}' |
              grep -vx "$RELEASE_TAG" |
              sort |
              tail -n 1 || true
          )"

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/openai/codex.git
          fi

          # The nightly rebase rewrites every fork commit, so a previous release
          # tag is never an ancestor of HEAD and hash ranges cannot identify new
          # fork work. Compare patch-ids instead: they survive rebases, while
          # new commits and folded fixes (fixup/autosquash) get new patch-ids
          # and correctly resurface in the changelog.
          write_patch_ids() {
            git rev-list "$@" |
              while IFS= read -r rev; do
                git diff-tree -p "$rev" |
                  git patch-id --stable |
                  awk -v rev="$rev" '{ print $1, rev }'
              done
          }

          : > "$fork_commits"
          : > "$upstream_commits"
          if git fetch --no-tags upstream main; then
            if [[ -n "$previous_tag" ]]; then
              previous_upstream_base="$(git merge-base "$previous_tag" upstream/main)"
              write_patch_ids "$previous_tag" --not "$previous_upstream_base" > "${RUNNER_TEMP}/previous-fork-patch-ids.txt"
              write_patch_ids upstream/main..HEAD > "${RUNNER_TEMP}/current-fork-patch-ids.txt"
              awk 'NR==FNR { seen[$1]=1; next } !($1 in seen)' \
                "${RUNNER_TEMP}/previous-fork-patch-ids.txt" \
                "${RUNNER_TEMP}/current-fork-patch-ids.txt" |
                cut -d' ' -f2 |
                xargs -r git show -s --format='%h %s' > "$fork_commits"

              # Upstream commits are never rebased away, so the exact upstream
              # range is bounded by HEAD's merge base with upstream/main.
              fork_upstream_base="$(git merge-base HEAD upstream/main)"
              git log --format='%h %s' "${previous_tag}..${fork_upstream_base}" > "$upstream_commits"
            else
              write_patch_ids upstream/main..HEAD |
                cut -d' ' -f2 |
                xargs -r git show -s --format='%h %s' > "$fork_commits"
            fi
          else
            echo "::warning::Failed to fetch upstream main; changelog cannot split fork and upstream commits."
            if [[ -n "$previous_tag" ]]; then
              git log --format='%h %s' "${previous_tag}..HEAD" > "$upstream_commits"
            else
              git log -n 200 --format='%h %s' > "$upstream_commits"
            fi
          fi

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Release version: ${RELEASE_VERSION}"
            echo "Previous release tag: ${previous_tag:-none}"
            echo
            echo "## New fork commits since previous release"
            if [[ -s "$fork_commits" ]]; then
              cat "$fork_commits"
            else
              echo "(none)"
            fi
            echo
            echo "## Upstream commits since previous release"
            if [[ -s "$upstream_commits" ]]; then
              cat "$upstream_commits"
            else
              echo "(none)"
            fi
          } > "$input_file"

          write_fallback_notes() {
            {
              echo "## Codex++ changes"
              if [[ -s "$fork_commits" ]]; then
                sed 's/^/- /' "$fork_commits"
              else
                echo "- No Codex++ changes in this release."
              fi
              echo
              echo "## Upstream sync"
              if [[ -s "$upstream_commits" ]]; then
                sed 's/^/- /' "$upstream_commits"
              else
                echo "- No upstream changes in this release."
              fi
              echo
              echo "**Full Changelog**: ${repo_url}/commits/${RELEASE_TAG}"
            } > "$notes_file"
          }

          package="dist/x86_64-unknown-linux-musl/codex-package-x86_64-unknown-linux-musl.tar.gz"
          bin_root="${RUNNER_TEMP}/codexpp"
          mkdir -p "$bin_root"
          tar -xzf "$package" -C "$bin_root"
          export PATH="${bin_root}/bin:${PATH}"
          codex++ --version

          prompt="$(cat <<EOF
          Read ${input_file}, write a user-facing English changelog for Codex++ ${RELEASE_VERSION}, and write the result only to ${notes_file}.

          Requirements:
          1. The first section heading is "## Codex++ changes": summarize user-visible features, fixes, and improvements from the New fork commits since previous release, merging multiple commits on the same topic into one item. If there are none, write exactly "No Codex++ changes in this release." under the heading.
          2. The second section heading is "## Upstream sync": summarize commits from Upstream commits since previous release, aggregating changes synced from upstream openai/codex by topic instead of listing every commit. If there are none, write exactly "No upstream changes in this release." under the heading.
          3. Ignore rebase, formatting, and CI-maintenance noise; never invent information that is not in the input.
          4. Keep the whole document under 60 lines and use no code blocks.
          5. The last line must be exactly: **Full Changelog**: ${repo_url}/commits/${RELEASE_TAG}
          6. Do not create, modify, or delete any file other than ${notes_file}.
          EOF
          )"

          # Run outside the repository so the model cannot dirty release inputs.
          cd "$RUNNER_TEMP"
          set +e
          timeout 420 codex++ exec \
            --model deepseek-v4-flash \
            --ephemeral \
            --dangerously-bypass-approvals-and-sandbox \
            -c 'model_provider="deepseek"' \
            -c 'model_providers.deepseek.name="DeepSeek"' \
            -c 'model_providers.deepseek.base_url="https://api.deepseek.com/"' \
            -c 'model_providers.deepseek.env_key="DEEPSEEK_API_KEY"' \
            -c 'model_providers.deepseek.wire_api="responses"' \
            -c 'model_context_window=1000000' \
            "$prompt"
          codex_status=$?
          set -e

          if [[ $codex_status -ne 0 || ! -s "$notes_file" ]]; then
            echo "::warning::Codex++ changelog generation failed (exit ${codex_status}); using raw commits."
            write_fallback_notes
          fi

          cat "$notes_file"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ needs.metadata.outputs.version }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/**
          overwrite_files: true
          make_latest: ${{ ! inputs.prerelease }}
          prerelease: ${{ inputs.prerelease }}
